name: consensus-ci

on:
  push:
    branches:
      - main
      - release/**
  pull_request:

concurrency:
  group: consensus-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMFD_BUILD_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot 2026-08-05
        with:
          toolchain: 1.88.0
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p cmfd-consensus --all-targets --features whir-prototype --locked
      - run: cargo check -p cmfd-consensus --all-targets --no-default-features --features dory-bls12-381-prototype --locked
      - run: cargo check -p cmfd-consensus --all-targets --no-default-features --features dory-bls12-381-prototype,whir-prototype --locked
      - run: cargo check -p cmfd-consensus --all-targets --no-default-features --features dory-v3-consensus-adapter --locked
      - run: cargo check --workspace --all-targets --features cmfd-consensus/dory-v3-consensus-adapter --locked
      - run: cargo check -p cmfd-consensus --all-targets --features gpu-proof-prover --locked
      - run: cargo check -p cmfd-consensus --all-targets --features production-whir-candidate,gpu-proof-prover --locked

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test release identity and archive guards
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-release-integrity.txt
          python3 -m unittest discover -s scripts/tests -p 'test_release_integrity.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_release_key_transition.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_update_rollback_qualification.py' -v
          bash -n scripts/release-linux-common.sh
          bash -n scripts/build-cuda-miner.sh
          bash -n scripts/build-opencl-miner.sh
          bash -n scripts/prepare-tauri-appimage-tools.sh
          bash -n scripts/normalize-linux-appimage.sh
          bash -n scripts/normalize-linux-deb.sh
          bash -n scripts/package-standalone-miner.sh
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot 2026-08-05
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - run: cargo install cargo-audit --version '=0.22.2' --locked
      - run: cargo audit
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p cmfd-consensus --all-targets --features whir-prototype --locked -- -D warnings
      - run: cargo clippy -p cmfd-consensus --all-targets --no-default-features --features dory-bls12-381-prototype --locked -- -D warnings
      - run: cargo clippy -p cmfd-consensus --all-targets --no-default-features --features dory-bls12-381-prototype,whir-prototype --locked -- -D warnings
      - run: cargo clippy -p cmfd-consensus --all-targets --no-default-features --features dory-v3-consensus-adapter --locked -- -D warnings
      - run: cargo clippy -p cmfd-consensus --all-targets --features gpu-proof-prover --locked -- -D warnings
      - run: cargo clippy -p cmfd-consensus --all-targets --features production-whir-candidate --locked -- -D warnings
      - run: cargo clippy -p cmfd-consensus --all-targets --features production-whir-candidate,gpu-proof-prover --locked --no-deps -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test -p common-foundry-wallet --lib --features production-v3-testnet --locked
      - run: >-
          cargo test -p cmfd-consensus --lib --no-default-features
          --features dory-v3-consensus-adapter --locked pow::tests::
      - run: >-
          cargo test -p cmfd-consensus --lib --no-default-features
          --features dory-v3-consensus-adapter --locked network::tests::
      - run: >-
          cargo test -p cmfd-consensus --lib --no-default-features
          --features dory-v3-consensus-adapter --locked chain::tests::
      - run: cargo test -p cmfd-consensus --lib --no-default-features --features dory-bls12-381-prototype --locked dory_v3_
      - run: cargo test -p cmfd-consensus --lib --no-default-features --features dory-bls12-381-prototype,whir-prototype --locked dory_bls12_381_layout::tests::dory_final_output_and_blake3_argument_share_exact_activation_bytes -- --exact
      - run: cargo test -p cmfd-consensus --all-targets --features whir-prototype --locked
      - run: cargo test -p cmfd-consensus --all-targets --features gpu-proof-prover --locked
      - run: cargo test -p cmfd-consensus --lib --features production-whir-candidate,gpu-proof-prover --locked production_candidate
      - name: Build and test the bounded ProductionV4 node surface
        run: |
          cargo check --locked -p cmfd-node --bin cmfd-node --features production-v4
          cargo test --locked -p cmfd-node --lib --features production-v4 production_v4_
      - name: Build the pinned ProductionV4 RC profile
        run: cargo check --locked -p cmfd-node --bin cmfd-node --features production-rc

  proof-codec:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test Windows release archive and executable guards
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-release-integrity.txt
          python -m unittest discover -s scripts/tests -p 'test_release_integrity.py' -v
          python -m unittest discover -s scripts/tests -p 'test_release_key_transition.py' -v
          python -m unittest discover -s scripts/tests -p 'test_update_rollback_qualification.py' -v
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot 2026-08-05
        with:
          toolchain: 1.88.0
      - name: Verify canonical WHIR proof bytes
        run: cargo test --locked -p cmfd-consensus --lib --features whir-prototype canonical_binary
      - name: Reject malformed WHIR proof bytes
        run: cargo test --locked -p cmfd-consensus --lib --features whir-prototype native_codec
      - name: Exercise Dory Type-6 CLI
        run: cargo test --locked -p cmfd-consensus --bin cmfd-consensus --no-default-features --features dory-bls12-381-prototype
      - name: Exercise the complete Dory V3 qualification verifier boundary
        run: >-
          cargo test --locked -p cmfd-consensus --lib --no-default-features
          --features dory-bls12-381-prototype,whir-prototype
          dory_v3_qualification::tests::
      - name: Require verifier-only Dory V3 qualification CLI inputs
        run: >-
          cargo test --locked -p cmfd-consensus --bin cmfd-consensus
          --no-default-features --features dory-bls12-381-prototype,whir-prototype
          tests::dory_v3_verify_qualification_cli_requires_absolute_paths_and_report_output
          -- --exact
      - name: Require absolute Dory V3 qualification CLI paths and journal
        run: >-
          cargo test --locked -p cmfd-consensus --bin cmfd-consensus
          --no-default-features --features dory-bls12-381-prototype,whir-prototype
          tests::dory_v3_qualification_cli_requires_absolute_paths
          -- --exact

  node-shutdown:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot 2026-08-05
        with:
          toolchain: 1.88.0
      - name: Interrupt stalled node services promptly
        run: cargo test --locked -p cmfd-node --lib stalled_
      - name: Exercise operating-system shutdown signals
        run: cargo test --locked -p cmfd-node --test graceful_shutdown -- --test-threads=1
      - name: Exercise persistent verifier containment and restart
        run: cargo test --locked -p cmfd-proof-worker --test verifier_worker -- --test-threads=1
      - name: Exercise Windows ProductionV3 proof-worker boundary
        if: runner.os == 'Windows'
        run: >-
          cargo test --locked -p cmfd-proof-worker --features production-v3
          --lib --test verifier_worker --no-fail-fast -- --test-threads=1

  wallet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wallet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/wallet/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: common-foundry-wallet-windows
            package-paths: |
              target/release/bundle/nsis/Common Foundry Wallet RCNet_0.1.0-rc.1_x64-setup.exe
            binary-path: target/release/common-foundry-wallet.exe
            node-path: target/release/cmfd-node.exe
          - os: ubuntu-22.04
            artifact: common-foundry-wallet-linux
            package-paths: |
              target/release/bundle/appimage/Common Foundry Wallet RCNet_0.1.0-rc.1_amd64.AppImage
              target/release/bundle/deb/Common Foundry Wallet RCNet_0.1.0-rc.1_amd64.deb
            binary-path: target/release/common-foundry-wallet
            node-path: target/release/cmfd-node
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            wget
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot 2026-08-05
        with:
          toolchain: 1.94.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/wallet/package-lock.json
      - run: npm ci
        working-directory: apps/wallet
      - name: Build static Windows node CLI
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p cmfd-node --features production-rc
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Build Linux node CLI
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p cmfd-node --features production-rc
      - name: Install pinned Tauri AppImage tools
        if: runner.os == 'Linux'
        env:
          CMFD_RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/prepare-tauri-appimage-tools.sh "$CMFD_RELEASE_COMMIT" prepare
      - run: >-
          npm run desktop:build -- --ci
          --config src-tauri/tauri.rcnet.conf.json
          --features production-rc -- --locked
        working-directory: apps/wallet
      - name: Verify pinned Tauri AppImage tools
        if: runner.os == 'Linux'
        env:
          CMFD_RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/prepare-tauri-appimage-tools.sh "$CMFD_RELEASE_COMMIT" verify
      - name: Normalize and verify Linux AppImage
        if: runner.os == 'Linux'
        env:
          CMFD_RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          bash scripts/normalize-linux-appimage.sh
          "target/release/bundle/appimage/Common Foundry Wallet RCNet_0.1.0-rc.1_amd64.AppImage"
          "$CMFD_RELEASE_COMMIT"
          "0.1.0-rc.1"
      - name: Normalize Linux deb package
        if: runner.os == 'Linux'
        env:
          CMFD_RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          bash scripts/normalize-linux-deb.sh
          "target/release/bundle/deb/Common Foundry Wallet RCNet_0.1.0-rc.1_amd64.deb"
          "$CMFD_RELEASE_COMMIT"
          "0.1.0-rc.1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.package-paths }}
            ${{ matrix.binary-path }}
            ${{ matrix.node-path }}
          if-no-files-found: error
