name: RC4 parallel validation

on:
  push:
    branches:
      - release/rc4-parallel-validation

concurrency:
  group: rc4-parallel-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMFD_BUILD_SOURCE_COMMIT: 4c45ddf1a0c99382dc175c8fd06d5b68e4bc6658

jobs:
  remaining-validation:
    name: RC4 / ${{ matrix.suite }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - suite: Dory qualification
            commands: |
              cargo test -p cmfd-consensus --lib --no-default-features --features dory-bls12-381-prototype --locked dory_v3_
              cargo test -p cmfd-consensus --lib --no-default-features --features dory-bls12-381-prototype,whir-prototype --locked dory_bls12_381_layout::tests::dory_final_output_and_blake3_argument_share_exact_activation_bytes -- --exact
          - suite: WHIR compatibility
            commands: |
              cargo test -p cmfd-consensus --all-targets --features whir-prototype --locked
          - suite: GPU prover compatibility
            commands: |
              cargo test -p cmfd-consensus --all-targets --features gpu-proof-prover --locked
              cargo test -p cmfd-consensus --lib --features production-whir-candidate,gpu-proof-prover --locked production_candidate
          - suite: ProductionV4 release profile
            commands: |
              cargo check --locked -p cmfd-node --bin cmfd-node --features production-v4
              cargo test --locked -p cmfd-node --lib --features production-v4 production_v4_
              cargo check --locked -p cmfd-node --bin cmfd-node --features production-rc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4c45ddf1a0c99382dc175c8fd06d5b68e4bc6658
          persist-credentials: false
      - name: Verify signed release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CMFD_BUILD_SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          git show --no-patch --format=fuller HEAD
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.1
      - name: Validate release source
        shell: bash
        run: ${{ matrix.commands }}
