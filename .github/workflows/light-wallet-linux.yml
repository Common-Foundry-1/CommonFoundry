name: Light Wallet Linux packages

on:
  push:
    branches: [feature/windows-light-wallet]
    paths:
      - .github/workflows/light-wallet-linux.yml
      - apps/android-wallet/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: apps/android-wallet/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/android-wallet/app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.1
      - name: Install native package and smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb xdotool dbus-x11
      - name: Check wallet core and frontend
        run: |
          cargo test --manifest-path ../Cargo.toml --locked
          cargo test --manifest-path ../Cargo.toml --locked -p cmfd-wallet-api -- --ignored
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
      - name: Build Linux packages and test native commands
        run: |
          pnpm tauri build --bundles appimage,deb -- --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked --release --features tauri/custom-protocol --lib
      - name: Smoke-test both packages in an isolated desktop
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          deb=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -s "$appimage" && test -s "$deb"
          extract=$(mktemp -d)
          dpkg-deb -x "$deb" "$extract"
          cat > "$RUNNER_TEMP/light-wallet-smoke.sh" <<'SH'
          set -euo pipefail
          export XDG_DATA_HOME="$(mktemp -d)"
          export APPIMAGE_EXTRACT_AND_RUN=1
          "$1" > "$RUNNER_TEMP/light-wallet-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/light-wallet-smoke.log"' EXIT
          for attempt in $(seq 1 30); do
            kill -0 "$pid"
            if xdotool search --onlyvisible --name '^Common Foundry Light Wallet$' >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
          SH
          xvfb-run -a dbus-run-session -- bash "$RUNNER_TEMP/light-wallet-smoke.sh" "$extract/usr/bin/common-foundry-light-wallet"
          xvfb-run -a dbus-run-session -- bash "$RUNNER_TEMP/light-wallet-smoke.sh" "$(realpath "$appimage")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: common-foundry-light-wallet-linux-x64
          if-no-files-found: error
          path: |
            apps/android-wallet/app/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/android-wallet/app/src-tauri/target/release/bundle/deb/*.deb
