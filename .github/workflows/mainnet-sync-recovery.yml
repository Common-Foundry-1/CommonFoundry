name: Mainnet sync recovery node

on:
  push:
    branches: [fix/mainnet-verifier-throughput-20261003]

permissions:
  contents: read

concurrency:
  group: mainnet-sync-recovery-${{ github.sha }}
  cancel-in-progress: false

env:
  CMFD_BUILD_SOURCE_COMMIT: ${{ github.sha }}
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  linux-node:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - name: Test the complete node library including bounded-fork regressions
        run: cargo test --release --locked -p cmfd-node --features production-v4 --lib -- --test-threads=4
      - name: Check production-mainnet code without warnings
        run: cargo clippy --locked -p cmfd-node --features production-mainnet --lib --tests -- -D warnings
      - name: Build native Linux mainnet node
        run: cargo build --release --locked -p cmfd-node --features production-mainnet --bin cmfd-node
      - name: Verify exact mainnet identity and package only the node
        run: |
          mkdir -p target/release/production-mainnet node-artifact
          cp packaging/mainnet/MAINNET-PLAN.json target/release/production-mainnet/
          target/release/cmfd-node mainnet-launch-info > node-artifact/identity.json
          python3 - <<'PY'
          import json, os
          value = json.load(open('node-artifact/identity.json'))
          assert value['source_commit'] == os.environ['CMFD_BUILD_SOURCE_COMMIT']
          assert value['launch_plan']['network_id'] == '88296bc39c10e8bc1dd4818d4d42412fe5f08210651110377f495da299812f62'
          assert value['launch_plan']['launch_plan_digest'] == '2133726558490606e89a8fe3499f32c9a35722ed0022e09b7cd1cd30239d04af'
          assert value['beacon_round'] == 32747812
          PY
          cp target/release/cmfd-node node-artifact/
          sha256sum node-artifact/cmfd-node > node-artifact/binary.sha256
          rustc -Vv > node-artifact/rustc.txt
          ldd node-artifact/cmfd-node > node-artifact/ldd.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainnet-sync-recovery-linux-node
          path: node-artifact/
          if-no-files-found: error
