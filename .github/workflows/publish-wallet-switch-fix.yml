name: Publish wallet switching fix

on:
  push:
    branches: [deploy/wallet-switch-fix-815b003e]
    paths: [.github/workflows/publish-wallet-switch-fix.yml]

permissions:
  contents: read

concurrency:
  group: commonfoundry-wallet-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify approved deployment artifacts
        run: sha256sum -c SHA256SUMS.txt
      - name: Install pinned deployment tool
        run: npm ci --ignore-scripts
      - name: Publish and verify wallet switching fix
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx wrangler deployments list --name commonfoundry-mainnet-wallet --json > before.json
          node verify-deployment.mjs before before.json
          npx wrangler deploy --strict --message 'Fix wallet switching backup prompt 815b003e'
          npx wrangler deployments list --name commonfoundry-mainnet-wallet --json > after.json
          node verify-deployment.mjs after after.json
