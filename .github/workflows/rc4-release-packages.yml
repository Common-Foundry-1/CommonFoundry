name: RC4 complete release packages

on:
  push:
    branches: [release/rc4-complete-packaging]

permissions:
  contents: read
  actions: read

concurrency:
  group: rc4-complete-release-packages
  cancel-in-progress: true

env:
  CMFD_BUILD_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  validated-code-baseline:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify unchanged code and completed RC4 test evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-rc4-packaging-baseline.py

  wallet:
    needs: validated-code-baseline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wallet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/wallet/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build

  desktop:
    needs: validated-code-baseline
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: common-foundry-wallet-windows
            package-paths: |
              target/release/bundle/nsis/Common Foundry Wallet RCNet_0.1.0-rc.4_x64-setup.exe
              target/runtime-bootstrap/commonfoundry-rc-runtime-bootstrap-windows-x86_64-v0.1.0-rc.4.zip
            binary-path: target/release/common-foundry-wallet.exe
            node-path: target/release/cmfd-node.exe
            miner-path: target/release/cmfd-miner.exe
            platform: windows-x86_64
          - os: ubuntu-22.04
            artifact: common-foundry-wallet-linux
            package-paths: |
              target/release/bundle/appimage/Common Foundry Wallet RCNet_0.1.0-rc.4_amd64.AppImage
              target/release/bundle/deb/Common Foundry Wallet RCNet_0.1.0-rc.4_amd64.deb
              target/runtime-bootstrap/commonfoundry-rc-runtime-bootstrap-linux-x86_64-v0.1.0-rc.4.tar.gz
            binary-path: target/release/common-foundry-wallet
            node-path: target/release/cmfd-node
            miner-path: target/release/cmfd-miner
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify release packaging tests
        run: |
          python -m pip install --require-hashes -r scripts/requirements-release-integrity.txt
          python -m unittest discover -s scripts/tests -p "test_*integrity.py" -q
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            wget
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot 2026-08-05
        with:
          toolchain: 1.94.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/wallet/package-lock.json
      - run: npm ci
        working-directory: apps/wallet
      - name: Build static Windows node CLI
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p cmfd-node -p cmfd-miner --features cmfd-node/production-rc,cmfd-miner/production-rc
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Build Linux node CLI
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p cmfd-node -p cmfd-miner --features cmfd-node/production-rc,cmfd-miner/production-rc
      - name: Install pinned Tauri AppImage tools
        if: runner.os == 'Linux'
        env:
          CMFD_RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/prepare-tauri-appimage-tools.sh "$CMFD_RELEASE_COMMIT" prepare
      - run: >-
          npm run desktop:build -- --ci
          --config src-tauri/tauri.rcnet.conf.json
          --features production-rc -- --locked
        working-directory: apps/wallet
      - name: Verify pinned Tauri AppImage tools
        if: runner.os == 'Linux'
        env:
          CMFD_RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/prepare-tauri-appimage-tools.sh "$CMFD_RELEASE_COMMIT" verify
      - name: Normalize and verify Linux AppImage
        if: runner.os == 'Linux'
        env:
          CMFD_RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          bash scripts/normalize-linux-appimage.sh
          "target/release/bundle/appimage/Common Foundry Wallet RCNet_0.1.0-rc.4_amd64.AppImage"
          "$CMFD_RELEASE_COMMIT"
          "0.1.0-rc.4"
      - name: Normalize Linux deb package
        if: runner.os == 'Linux'
        env:
          CMFD_RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          bash scripts/normalize-linux-deb.sh
          "target/release/bundle/deb/Common Foundry Wallet RCNet_0.1.0-rc.4_amd64.deb"
          "$CMFD_RELEASE_COMMIT"
          "0.1.0-rc.4"
      - name: Package complete RCNet runtime bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/package-wallet-runtime-bootstrap.ps1
          -ExpectedCommit "${{ github.sha }}"
          -Version "0.1.0-rc.4"
          -OutputDirectory "target/runtime-bootstrap"
      - name: Package complete RCNet runtime bootstrap (Linux)
        if: runner.os == 'Linux'
        run: >-
          bash scripts/package-wallet-runtime-bootstrap.sh
          "${{ github.sha }}"
          "0.1.0-rc.4"
          "target/runtime-bootstrap"
      - name: Attest native packaged runtime
        run: >-
          python scripts/release_integrity.py runtime-attest
          --platform "${{ matrix.platform }}"
          --package-directory target/release
          --expected-commit "${{ github.sha }}"
          --expected-version "0.1.0-rc.4"
          --output "target/runtime-bootstrap/RUNTIME-ATTESTATION-${{ runner.os == 'Windows' && 'WINDOWS' || 'LINUX' }}-X86_64.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.package-paths }}
            ${{ matrix.binary-path }}
            ${{ matrix.node-path }}
            ${{ matrix.miner-path }}
            target/runtime-bootstrap/RUNTIME-ATTESTATION-*.json
          if-no-files-found: error
