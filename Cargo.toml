[workspace]
members = [
    "apps/wallet/src-tauri",
    "crates/cmfd-consensus",
    "crates/cmfd-cuda",
    "crates/cmfd-marketplace",
    "crates/cmfd-miner",
    "crates/cmfd-node",
]
exclude = ["third_party/p3-util-0.6.3-msrv"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
fs2 = "0.4.3"
hex = "0.4"
k256 = { version = "0.13", features = ["schnorr"] }
libloading = "0.8.9"
primitive-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
# Plonky3 0.6.3 uses slice::assume_init_ref, which stabilized after our Rust 1.88 MSRV.
# This is the exact 0.6.3 source with only its former equivalent conversion restored.
p3-util = { path = "third_party/p3-util-0.6.3-msrv" }
