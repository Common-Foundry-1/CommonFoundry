[workspace]
exclude = ["app/plugins", "app/src-tauri"]
members = [
    "crates/cmfd-wallet-api",
    "crates/cmfd-wallet-core",
    "crates/cmfd-wallet-engine",
    "crates/cmfd-wallet-storage",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"
version = "0.1.2"

[workspace.dependencies]
argon2 = "0.5.3"
blake3 = "=1.8.6"
chacha20poly1305 = "0.11.0"
getrandom = "0.3.4"
hex = "0.4"
k256 = { version = "0.14.0", features = ["schnorr"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1.9.0", features = ["derive"] }
