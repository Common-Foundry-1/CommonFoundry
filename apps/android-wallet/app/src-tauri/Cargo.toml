[package]
name = "common-foundry-android-wallet"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[lib]
name = "common_foundry_android_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "common-foundry-android-wallet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
cmfd-wallet-api = { path = "../../crates/cmfd-wallet-api" }
cmfd-wallet-core = { path = "../../crates/cmfd-wallet-core" }
cmfd-wallet-engine = { path = "../../crates/cmfd-wallet-engine" }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-cmfd-android = { path = "../plugins" }
thiserror = "2"
zeroize = "1.9.0"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "=2.4.6"

[workspace]
