# Ingress-only validation example, NOT the live tunnel configuration.
# At approved cutover, merge only this hostname rule into the existing ingress
# list. Preserve its tunnel credentials, RC/pool rules and final catch-all.
ingress:
  - hostname: mainnet-explorer-origin.commonfoundry.ai
    path: '^/v1/explorer(?:$|/block/(?:[0-9]+|[0-9a-fA-F]{64})$|/transaction/[0-9a-fA-F]{64}$|/address/[0-9a-fA-F]{64}(?:/[0-9a-fA-F]{64}\.[1-9][0-9]{0,19}\.(?:0|[1-9][0-9]{0,3}))?$)'
    service: http://127.0.0.1:29456
  # Dedicated, bounded Germany proof proxy. It forwards only exact UTXO reads
  # to Germany's local validating node; never point it at the failover router.
  - hostname: mainnet-proof-origin.commonfoundry.ai
    path: '^/v1/explorer/utxo/[0-9a-f]{64}/(?:0|[1-9][0-9]{0,9})$'
    service: http://127.0.0.1:29457
  # Separate validating Proxmox relay via its dedicated reverse SSH tunnel.
  # This never uses the explorer failover router or Singapore wallet gateway.
  - hostname: mainnet-proof-backup-origin.commonfoundry.ai
    path: '^/v1/explorer/utxo/[0-9a-f]{64}/(?:0|[1-9][0-9]{0,9})$'
    service: http://127.0.0.1:29458
  - service: http_status:404
