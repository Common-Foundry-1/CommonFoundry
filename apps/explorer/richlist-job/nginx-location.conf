# Inside the TLS server block of sg-rpc.commonfoundry.ai. The explorer Worker reads this file
# (cached for a minute at the edge) and serves it as /api/richlist.
    location = /stats/richlist.json {
        limit_except GET { deny all; }
        alias /var/lib/cmfd-richlist/public/richlist.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=30" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
