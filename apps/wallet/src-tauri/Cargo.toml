[package]
name = "common-foundry-wallet"
version = "0.1.0-rc.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "common_foundry_wallet"
path = "src/lib.rs"

[[bin]]
name = "common-foundry-wallet"
path = "src/main.rs"

[features]
default = []
# Embeds the built frontend and serves it over the tauri custom protocol.
# Without this feature the tauri context bakes in the Vite dev URL, so a
# release wallet built by plain `cargo build` opens an empty window. Every
# packaged wallet build must enable it (the tauri CLI does so implicitly).
custom-protocol = ["tauri/custom-protocol"]
production-v3 = [
    "cmfd-node/production-v3",
    "cmfd-proof-worker/production-v3",
]
production-v3-testnet = ["production-v3", "cmfd-node/production-v3-testnet"]
production-v4 = ["cmfd-node/production-v4"]
production-v4-testnet = ["production-v4", "cmfd-node/production-v4-testnet"]
production-rc = ["production-v4", "cmfd-node/production-rc"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22"
cmfd-consensus = { path = "../../../crates/cmfd-consensus" }
cmfd-cuda = { path = "../../../crates/cmfd-cuda" }
cmfd-node = { path = "../../../crates/cmfd-node" }
cmfd-proof-worker = { path = "../../../crates/cmfd-proof-worker" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.3"
zeroize.workspace = true

[dev-dependencies]
sha2.workspace = true
