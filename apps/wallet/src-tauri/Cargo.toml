[package]
name = "common-foundry-wallet"
version = "0.1.0-devnet.14"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "common_foundry_wallet"
path = "src/lib.rs"

[[bin]]
name = "common-foundry-wallet"
path = "src/main.rs"

[features]
default = []
production-v3 = [
    "cmfd-node/production-v3",
    "cmfd-proof-worker/production-v3",
]
production-rc = ["production-v3", "cmfd-node/production-rc"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
cmfd-consensus = { path = "../../../crates/cmfd-consensus" }
cmfd-cuda = { path = "../../../crates/cmfd-cuda" }
cmfd-node = { path = "../../../crates/cmfd-node" }
cmfd-proof-worker = { path = "../../../crates/cmfd-proof-worker" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.3"

[dev-dependencies]
sha2.workspace = true
