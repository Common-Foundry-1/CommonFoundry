[[permission]]
identifier = "wallet-commands"
description = "Allows the main wallet window to use the eleven bounded embedded Devnet node and solo-mining operations."
commands.allow = [
  "get_node_status",
  "get_peer_settings",
  "update_peer_settings",
  "get_wallet_snapshot",
  "get_mempool_snapshot",
  "send_wallet_transaction",
  "consolidate_wallet",
  "mine_devnet_block",
  "get_mining_status",
  "start_mining",
  "stop_mining",
]
