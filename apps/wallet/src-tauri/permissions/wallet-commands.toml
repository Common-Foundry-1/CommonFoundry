[[permission]]
identifier = "wallet-commands"
description = "Allows the main wallet window to use the bounded embedded node, solo-mining, local wallet-custody and update operations."
commands.allow = [
  "get_node_status",
  "get_peer_settings",
  "update_peer_settings",
  "get_wallet_snapshot",
  "get_mempool_snapshot",
  "send_wallet_transaction",
  "consolidate_wallet",
  "mine_devnet_block",
  "get_mining_status",
  "start_mining",
  "stop_mining",
  "get_wallet_custody_status",
  "unlock_wallet",
  "lock_wallet",
  "backup_wallet",
  "create_wallet",
  "choose_wallet_backup_path",
  "migrate_wallet_encryption",
  "restore_wallet",
  "resync_chain",
  "get_update_status",
  "set_update_automatic",
  "check_for_updates",
  "download_update",
  "restart_to_update",
  "retry_update",
  "run_older_anyway",
  "remove_old_versions",
]
