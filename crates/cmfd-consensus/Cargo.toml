[package]
name = "cmfd-consensus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
ark-bls12-381 = { version = "=0.5.0", optional = true }
ark-ec = { version = "=0.5.0", optional = true }
ark-ff = { version = "=0.5.0", features = ["parallel"], optional = true }
ark-serialize = { version = "=0.5.0", optional = true }
bincode = { version = "1.3.3", optional = true }
blake3.workspace = true
clap.workspace = true
cmfd-marketplace = { path = "../cmfd-marketplace" }
cmfd-proof-accel = { path = "../cmfd-proof-accel", optional = true }
ctrlc.workspace = true
dory-pcs = { version = "=0.4.2", default-features = false, features = ["arkworks"], optional = true }
# Remainder's arkworks graph accepts 4.3, while 4.4 requires Rust 1.89.
enum-ordinalize = { version = "=4.3.0", optional = true }
frontend = { git = "https://github.com/worldcoin/Remainder_CE", rev = "5687fe7f3a077c75c374422ef79f22e3860de9c1", optional = true }
flate2 = { version = "=1.1.9", optional = true }
fs2 = { workspace = true, optional = true }
hex.workspace = true
k256.workspace = true
primitive-types.workspace = true
p3-blake3 = { version = "=0.6.3", optional = true }
p3-blake3-air = { version = "=0.6.3", optional = true }
p3-air = { version = "=0.6.3", optional = true }
p3-batch-stark = { version = "=0.6.3", optional = true }
p3-challenger = { version = "=0.6.3", optional = true }
p3-commit = { version = "=0.6.3", optional = true }
p3-dft = { version = "=0.6.3", optional = true }
p3-field = { version = "=0.6.3", optional = true }
p3-fri = { version = "=0.6.3", optional = true }
p3-goldilocks = { version = "=0.6.3", optional = true }
p3-lookup = { version = "=0.6.3", optional = true }
p3-matrix = { version = "=0.6.3", optional = true }
p3-merkle-tree = { version = "=0.6.3", optional = true }
p3-multilinear-util = { version = "=0.6.3", optional = true }
p3-sumcheck = { version = "=0.6.3", optional = true }
p3-symmetric = { version = "=0.6.3", optional = true }
p3-uni-stark = { version = "=0.6.3", optional = true }
p3-whir = { version = "=0.6.3", optional = true }
remainder = { git = "https://github.com/worldcoin/Remainder_CE", rev = "5687fe7f3a077c75c374422ef79f22e3860de9c1", optional = true }
rand_core = { version = "=0.6.4", features = ["getrandom"], optional = true }
rayon = { workspace = true, optional = true }
same-file = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
shared-types = { git = "https://github.com/worldcoin/Remainder_CE", rev = "5687fe7f3a077c75c374422ef79f22e3860de9c1", optional = true }
thiserror.workspace = true

[features]
default = []
dory-bls12-381-prototype = [
    "dory-opening-prototype",
    "dep:ark-bls12-381",
    "dep:ark-ec",
    "dep:ark-ff",
    "dep:fs2",
    "dep:rand_core",
    "dep:rayon",
    "dep:same-file",
    "dep:libc",
    "dep:sha2",
    "dep:windows-sys",
]
dory-opening-prototype = ["dep:ark-serialize", "dep:dory-pcs"]
gpu-proof-prover = ["whir-prototype", "dep:cmfd-proof-accel", "dep:fs2"]
production-whir-candidate = ["whir-prototype"]
remainder-prototype = [
    "dep:bincode",
    "dep:enum-ordinalize",
    "dep:frontend",
    "dep:remainder",
    "dep:shared-types",
]
whir-prototype = [
    "dep:bincode",
    "dep:p3-air",
    "dep:p3-batch-stark",
    "p3-batch-stark/parallel",
    "dep:flate2",
    "dep:p3-blake3",
    "p3-blake3/parallel",
    "dep:p3-blake3-air",
    "p3-blake3-air/parallel",
    "dep:p3-challenger",
    "dep:p3-commit",
    "dep:p3-dft",
    "p3-dft/parallel",
    "dep:p3-field",
    "dep:p3-fri",
    "dep:p3-goldilocks",
    "dep:p3-lookup",
    "p3-lookup/parallel",
    "dep:p3-matrix",
    "dep:p3-merkle-tree",
    "dep:p3-multilinear-util",
    "p3-multilinear-util/parallel",
    "dep:p3-sumcheck",
    "p3-sumcheck/parallel",
    "dep:p3-symmetric",
    "dep:p3-uni-stark",
    "p3-uni-stark/parallel",
    "dep:p3-whir",
    "p3-whir/parallel",
]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[lib]
name = "cmfd_consensus"
path = "src/lib.rs"

[[bin]]
name = "cmfd-consensus"
path = "src/main.rs"
