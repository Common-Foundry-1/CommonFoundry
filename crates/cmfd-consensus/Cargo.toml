[package]
name = "cmfd-consensus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
bincode = { version = "1.3.3", optional = true }
blake3.workspace = true
clap.workspace = true
cmfd-marketplace = { path = "../cmfd-marketplace" }
# Remainder's arkworks graph accepts 4.3, while 4.4 requires Rust 1.89.
enum-ordinalize = { version = "=4.3.0", optional = true }
frontend = { git = "https://github.com/worldcoin/Remainder_CE", rev = "5687fe7f3a077c75c374422ef79f22e3860de9c1", optional = true }
hex.workspace = true
k256.workspace = true
primitive-types.workspace = true
remainder = { git = "https://github.com/worldcoin/Remainder_CE", rev = "5687fe7f3a077c75c374422ef79f22e3860de9c1", optional = true }
serde.workspace = true
serde_json.workspace = true
shared-types = { git = "https://github.com/worldcoin/Remainder_CE", rev = "5687fe7f3a077c75c374422ef79f22e3860de9c1", optional = true }
thiserror.workspace = true

[features]
default = []
remainder-prototype = [
    "dep:bincode",
    "dep:enum-ordinalize",
    "dep:frontend",
    "dep:remainder",
    "dep:shared-types",
]

[lib]
name = "cmfd_consensus"
path = "src/lib.rs"

[[bin]]
name = "cmfd-consensus"
path = "src/main.rs"
