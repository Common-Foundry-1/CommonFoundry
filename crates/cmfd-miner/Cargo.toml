[package]
name = "cmfd-miner"
version = "1.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
production-v3 = [
    "cmfd-consensus/dory-v3-consensus-adapter",
    "cmfd-node/production-v3",
]
production-v3-testnet = [
    "production-v3",
    "cmfd-node/production-v3-testnet",
    "dep:same-file",
]
production-v4 = [
    "cmfd-consensus/forgematrix-v4-verifier",
    "cmfd-node/production-v4",
    "dep:same-file",
]
production-v4-testnet = ["production-v4", "cmfd-node/production-v4-testnet"]
production-rc = ["production-v4", "cmfd-node/production-rc"]
production-mainnet = ["production-v4", "cmfd-node/production-mainnet"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
cmfd-cuda = { path = "../cmfd-cuda" }
cmfd-consensus = { path = "../cmfd-consensus" }
cmfd-node = { path = "../cmfd-node" }
ctrlc.workspace = true
fs2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
same-file = { workspace = true, optional = true }

[[bin]]
name = "cmfd-miner"
path = "src/main.rs"
