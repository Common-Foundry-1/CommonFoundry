[package]
name = "cmfd-node"
version = "0.1.0-devnet.15"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = []
production-v3 = [
    "cmfd-consensus/dory-v3-consensus-adapter",
    "cmfd-proof-worker/production-v3",
]
production-v3-testnet = ["production-v3"]
production-rc = ["production-v3"]

[dependencies]
blake3.workspace = true
clap.workspace = true
cmfd-consensus = { path = "../cmfd-consensus" }
cmfd-proof-worker = { path = "../cmfd-proof-worker" }
ctrlc = { workspace = true, features = ["termination"] }
fs2.workspace = true
getrandom = "0.3"
hex.workspace = true
k256.workspace = true
primitive-types.workspace = true
rcgen = "=0.14.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
# Keep the certificate stack on the versions exercised by this Devnet release.
time = { version = "=0.3.47", default-features = false }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[lib]
name = "cmfd_node"
path = "src/lib.rs"

[[bin]]
name = "cmfd-node"
path = "src/main.rs"
