[package]
name = "cmfd-proof-worker"
version = "0.1.0-devnet.14"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
production-v3 = ["cmfd-consensus/dory-v3-consensus-adapter"]

[dependencies]
cmfd-consensus = { path = "../cmfd-consensus", features = ["gpu-proof-prover"] }
cmfd-proof-accel = { path = "../cmfd-proof-accel" }
blake3.workspace = true
getrandom = "0.3"
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Environment",
    "Win32_System_ErrorReporting",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[lib]
name = "cmfd_proof_worker"
path = "src/lib.rs"

[[bin]]
name = "cmfd-proof-worker"
path = "src/main.rs"

[[test]]
name = "persistent_fault_worker"
path = "tests/persistent_fault_worker.rs"
harness = false
